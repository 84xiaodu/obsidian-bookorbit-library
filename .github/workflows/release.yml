name: Package and release

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release (for example, 1.0.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      archive: ${{ steps.bundle.outputs.archive }}
      commit: ${{ steps.bundle.outputs.commit }}
      create_tag: ${{ steps.source.outputs.create_tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - name: Select source
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_REF: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          if [[ -n "$tag" && ! "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'A release tag must be a Semantic Version in x.y.z format.' >&2
            exit 1
          fi
          if [[ -n "$tag" ]]; then
            ref="$PUSH_REF"
            create_tag=false
            if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              remote_tag=$(git ls-remote --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag")
              if [[ -n "$remote_tag" ]]; then ref="refs/tags/$tag"; else create_tag=true; fi
            fi
            printf 'ref=%s\ntag=%s\ncreate_tag=%s\npublish=true\n' "$ref" "$tag" "$create_tag" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\npublish=false\n' "$PUSH_REF" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            reader-deps/package-lock.json

      - name: Verify version, build and package
        id: bundle
        env:
          EXPECTED_TAG: ${{ steps.source.outputs.tag }}
        run: |
          manifest=manifest.json
          if [[ ! -f "$manifest" ]]; then manifest=bookorbit-reading/manifest.json; fi
          version=$(node -p 'require("./" + process.argv[1]).version' "$manifest")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'The plugin manifest must contain a Semantic Version in x.y.z format.' >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_TAG" && "$EXPECTED_TAG" != "$version" ]]; then
            printf 'Release tag %s points to plugin version %s.\n' "$EXPECTED_TAG" "$version" >&2
            exit 1
          fi
          marketplace=false
          if [[ "$manifest" == manifest.json ]]; then
            npm ci
            npm run build
            plugin="release-$version/bookorbit-library"
            mkdir -p "$plugin"
            cp main.js manifest.json styles.css LICENSE "$plugin/"
            cp bookorbit-reading/README.md "$plugin/README.md"
            marketplace=true
          else
            npm ci --prefix reader-deps
            node build-bookorbit-reader.cjs
          fi
          archive="bookorbit-library-$version.zip"
          (cd "release-$version" && zip -q -r "$GITHUB_WORKSPACE/$archive" bookorbit-library)
          unzip -tq "$archive"
          commit=$(git rev-parse HEAD)
          printf 'version=%s\narchive=%s\ncommit=%s\nmarketplace=%s\n' "$version" "$archive" "$commit" "$marketplace" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bookorbit-library-${{ steps.bundle.outputs.version }}
          path: |
            ${{ steps.bundle.outputs.archive }}
            ${{ steps.bundle.outputs.marketplace == 'true' && 'main.js' || '' }}
            ${{ steps.bundle.outputs.marketplace == 'true' && 'manifest.json' || '' }}
            ${{ steps.bundle.outputs.marketplace == 'true' && 'styles.css' || '' }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: bookorbit-library-${{ needs.package.outputs.version }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          ARCHIVE: ${{ needs.package.outputs.archive }}
          SOURCE_COMMIT: ${{ needs.package.outputs.commit }}
          CREATE_TAG: ${{ needs.package.outputs.create_tag }}
        run: |
          remote_tags=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$VERSION" "refs/tags/$VERSION^{}")
          remote_commit=$(awk 'NR == 1 || $2 ~ /\^\{\}$/ { commit = $1 } END { print commit }' <<< "$remote_tags")
          tag_args=(--verify-tag)
          if [[ -z "$remote_commit" && "$CREATE_TAG" == true ]]; then
            tag_args=(--target "$SOURCE_COMMIT")
          elif [[ "$remote_commit" != "$SOURCE_COMMIT" ]]; then
            printf 'Expected tag %s to point to %s, found %s.\n' "$VERSION" "$SOURCE_COMMIT" "$remote_commit" >&2
            exit 1
          fi
          assets=("$ARCHIVE")
          if [[ -f manifest.json ]]; then assets+=(main.js manifest.json styles.css); fi
          if release=$(gh release view "$VERSION" --json isDraft,assets); then
            missing=()
            for asset in "${assets[@]}"; do
              if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$release" > /dev/null; then
                missing+=("$asset")
              fi
            done
            if ((${#missing[@]})); then gh release upload "$VERSION" "${missing[@]}"; fi
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release edit "$VERSION" --draft=false --target "$SOURCE_COMMIT"
            fi
          else
            gh release create "$VERSION" "${assets[@]}" "${tag_args[@]}" --title "BookOrbit Library $VERSION" --generate-notes \
              --notes '下载安装包并解压，把整个 bookorbit-library 文件夹放入仓库的 .obsidian/plugins/。需要 Obsidian 桌面版 1.11.5 或更新版本。'
          fi
          gh release view "$VERSION" --json url,isDraft,assets
